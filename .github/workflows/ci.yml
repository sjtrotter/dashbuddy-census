name: CI
on:
    pull_request:
    push:
        branches: [main]
permissions:
    contents: read
jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: census
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: census
                  persist-credentials: false
            - name: Build and test (runner Docker enables MigrationTest)
              run: ./gradlew build --no-daemon -PcensusContractPath="$GITHUB_WORKSPACE/DashBuddy/census-contract"
