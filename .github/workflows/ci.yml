name: CI
on:
    pull_request:
    push:
        branches: [main]
permissions:
    contents: read
env:
    DASHBUDDY_CONTRACT_SHA: 75923ccc864c79c9b69477624bf27e2e1016696f
jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: census
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: census
                  persist-credentials: false
            # The wire contract is an included build of the app repo, pinned to a reviewed SHA
            # (workflow pin DASHBUDDY_CONTRACT_SHA — bump deliberately).
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: sjtrotter/DashBuddy
                  ref: ${{ env.DASHBUDDY_CONTRACT_SHA }}
                  path: DashBuddy
                  persist-credentials: false
            - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
              with:
                  distribution: temurin
                  java-version: "21"
            - name: Build and test (runner Docker enables MigrationTest)
              run: ./gradlew build --no-daemon -PcensusContractPath="$GITHUB_WORKSPACE/DashBuddy/census-contract"
            - name: Edge image builds and the committed Caddyfile adapts with it (#1178)
              run: |
                  docker build -q -t census-caddy-ci deploy/caddy
                  docker run --rm census-caddy-ci caddy list-modules | grep -Fxq 'http.handlers.rate_limit'
                  docker run --rm -v "$PWD/deploy/compose/Caddyfile:/etc/caddy/Caddyfile:ro" \
                      -e PUBLIC_HOST=census.example.test -e ACME_EMAIL=ops@example.test -e OPS_BIND_IP=127.0.0.1 \
                      census-caddy-ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
    terraform:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
              with:
                  terraform_version: "1.16.4"
            - name: fmt
              run: terraform fmt -recursive -check -diff deploy/aws
            - name: validate deploy/aws
              working-directory: deploy/aws
              run: terraform init -backend=false -input=false && terraform validate
            - name: validate deploy/aws/bootstrap
              working-directory: deploy/aws/bootstrap
              run: terraform init -backend=false -input=false && terraform validate
