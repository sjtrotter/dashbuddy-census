name: Publish image
on:
    push:
        tags: ['v*']
permissions: {}
jobs:
    test:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: census
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: census
                  persist-credentials: false
            - name: Require a full contract commit pin
              env:
                  CONTRACT_SHA: ${{ vars.DASHBUDDY_CONTRACT_SHA }}
              run: '[[ "$CONTRACT_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Set DASHBUDDY_CONTRACT_SHA to a full commit SHA"; exit 1; }'
            # Pin, bump deliberately. Sibling checkouts live under GITHUB_WORKSPACE.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: sjtrotter/DashBuddy
                  ref: ${{ vars.DASHBUDDY_CONTRACT_SHA }}
                  path: DashBuddy
                  persist-credentials: false
            - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
              with:
                  distribution: temurin
                  java-version: '21'
            - name: Build and test (runner Docker enables MigrationTest)
              run: ./gradlew build --no-daemon -PcensusContractPath="$GITHUB_WORKSPACE/DashBuddy/census-contract"
    image:
        needs: test
        permissions:
            contents: read
            packages: write
            id-token: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: census
                  persist-credentials: false
            - name: Require a full contract commit pin
              env:
                  CONTRACT_SHA: ${{ vars.DASHBUDDY_CONTRACT_SHA }}
              run: '[[ "$CONTRACT_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Set DASHBUDDY_CONTRACT_SHA to a full commit SHA"; exit 1; }'
            # Pin, bump deliberately; the image uses exactly this contract revision.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: sjtrotter/DashBuddy
                  ref: ${{ vars.DASHBUDDY_CONTRACT_SHA }}
                  path: DashBuddy
                  persist-credentials: false
            - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              id: build
              with:
                  context: census
                  file: census/Dockerfile
                  build-contexts: |
                      census-contract=./DashBuddy/census-contract
                      dashbuddy-gradle=./DashBuddy/gradle
                  platforms: linux/amd64,linux/arm64
                  push: true
                  # Only the candidate is published before both architectures pass scanning.
                  tags: ghcr.io/sjtrotter/dashbuddy-census:candidate-${{ github.sha }}
                  build-args: |
                      CENSUS_CONTRACT_PATH=/workspace/dashbuddy/census-contract
                      SERVER_VERSION=${{ github.ref_name }}
                  provenance: true
                  sbom: true
            - name: Fail on CRITICAL or HIGH vulnerabilities (amd64)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              env:
                  TRIVY_PLATFORM: linux/amd64
              with:
                  image-ref: ghcr.io/sjtrotter/dashbuddy-census@${{ steps.build.outputs.digest }}
                  severity: CRITICAL,HIGH
                  exit-code: '1'
                  format: table
            - name: Fail on CRITICAL or HIGH vulnerabilities (arm64)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              env:
                  TRIVY_PLATFORM: linux/arm64
              with:
                  image-ref: ghcr.io/sjtrotter/dashbuddy-census@${{ steps.build.outputs.digest }}
                  severity: CRITICAL,HIGH
                  exit-code: '1'
                  format: table
            - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
              with:
                  image: ghcr.io/sjtrotter/dashbuddy-census@${{ steps.build.outputs.digest }}
                  format: spdx-json
                  output-file: sbom.spdx.json
                  upload-release-assets: false
            - name: Promote the scanned manifest with its provenance and SBOM
              env:
                  IMAGE: ghcr.io/sjtrotter/dashbuddy-census
                  DIGEST: ${{ steps.build.outputs.digest }}
                  VERSION: ${{ github.ref_name }}
              run: |
                  docker buildx imagetools create \
                      --tag "$IMAGE:$VERSION" \
                      --tag "$IMAGE:latest" \
                      "$IMAGE@$DIGEST"
                  published_digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
                  test "$published_digest" = "$DIGEST"
            - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
            - name: Sign the promoted immutable image digest (keyless)
              env:
                  IMAGE: ghcr.io/sjtrotter/dashbuddy-census@${{ steps.build.outputs.digest }}
              run: cosign sign --yes "$IMAGE"
