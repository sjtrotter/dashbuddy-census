name: Publish image
on:
    push:
        tags: ['v*']
permissions: {}
jobs:
    test:
        permissions:
            contents: read
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: census
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: census
                  persist-credentials: false
            - name: Require a full contract commit pin
              env:
                  CONTRACT_SHA: ${{ vars.DASHBUDDY_CONTRACT_SHA }}
              run: '[[ "$CONTRACT_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Set DASHBUDDY_CONTRACT_SHA to a full commit SHA"; exit 1; }'
            # Pin, bump deliberately. Sibling checkouts live under GITHUB_WORKSPACE.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: sjtrotter/DashBuddy
                  ref: ${{ vars.DASHBUDDY_CONTRACT_SHA }}
                  path: DashBuddy
                  persist-credentials: false
            - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
              with:
                  distribution: temurin
                  java-version: '21'
            - name: Bootstrap wrapper JAR from the pinned app checkout
              run: cp "$GITHUB_WORKSPACE/DashBuddy/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
            - name: Build and test (runner Docker enables MigrationTest)
              run: ./gradlew build --no-daemon -PcensusContractPath="$GITHUB_WORKSPACE/DashBuddy/census-contract"
    image:
        needs: test
        permissions:
            contents: read
            packages: write
            id-token: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: census
                  persist-credentials: false
            - name: Require a full contract commit pin
              env:
                  CONTRACT_SHA: ${{ vars.DASHBUDDY_CONTRACT_SHA }}
              run: '[[ "$CONTRACT_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Set DASHBUDDY_CONTRACT_SHA to a full commit SHA"; exit 1; }'
            # Pin, bump deliberately; the image uses exactly this contract revision.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: sjtrotter/DashBuddy
                  ref: ${{ vars.DASHBUDDY_CONTRACT_SHA }}
                  path: DashBuddy
                  persist-credentials: false
            - name: Bootstrap wrapper JAR
              run: cp DashBuddy/gradle/wrapper/gradle-wrapper.jar census/gradle/wrapper/
            - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
            - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
            - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              id: build
              with:
                  context: census
                  file: census/Dockerfile
                  build-contexts: |
                      census-contract=./DashBuddy/census-contract
                      dashbuddy-gradle=./DashBuddy/gradle
                  platforms: linux/amd64,linux/arm64
                  push: true
                  # Only the candidate is published before both architectures pass scanning.
                  tags: ghcr.io/sjtrotter/dashbuddy-census:candidate-${{ github.sha }}
                  build-args: |
                      CENSUS_CONTRACT_PATH=/workspace/dashbuddy/census-contract
                      SERVER_VERSION=${{ github.ref_name }}
                  provenance: true
                  sbom: true
            - name: Fail on CRITICAL or HIGH vulnerabilities (amd64)
              uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
              env:
                  TRIVY_PLATFORM: linux/amd64
              with:
                  image-ref: ghcr.io/sjtrotter/dashbuddy-census@${{ steps.build.outputs.digest }}
                  severity: CRITICAL,HIGH
                  exit-code: '1'
                  format: table
            - name: Fail on CRITICAL or HIGH vulnerabilities (arm64)
              uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
              env:
                  TRIVY_PLATFORM: linux/arm64
              with:
                  image-ref: ghcr.io/sjtrotter/dashbuddy-census@${{ steps.build.outputs.digest }}
                  severity: CRITICAL,HIGH
                  exit-code: '1'
                  format: table
            - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
              with:
                  image: ghcr.io/sjtrotter/dashbuddy-census@${{ steps.build.outputs.digest }}
                  format: spdx-json
                  output-file: sbom.spdx.json
                  upload-release-assets: false
            - name: Promote the scanned manifest with its provenance and SBOM
              env:
                  IMAGE: ghcr.io/sjtrotter/dashbuddy-census
                  DIGEST: ${{ steps.build.outputs.digest }}
                  VERSION: ${{ github.ref_name }}
              run: |
                  docker buildx imagetools create \
                      --tag "$IMAGE:$VERSION" \
                      --tag "$IMAGE:latest" \
                      "$IMAGE@$DIGEST"
                  published_digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
                  test "$published_digest" = "$DIGEST"
            - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
            - name: Sign the promoted immutable image digest (keyless)
              env:
                  IMAGE: ghcr.io/sjtrotter/dashbuddy-census@${{ steps.build.outputs.digest }}
              run: cosign sign --yes "$IMAGE"
