name: Publish edge image
on:
    push:
        tags: ['caddy-v*']
permissions: {}
jobs:
    image:
        permissions:
            contents: read
            packages: write
            id-token: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              id: build
              with:
                  context: deploy/caddy
                  file: deploy/caddy/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  # Only the candidate is published before both architectures pass scanning.
                  tags: ghcr.io/sjtrotter/dashbuddy-census-caddy:candidate-${{ github.sha }}
                  provenance: true
                  sbom: true
            - name: Fail on CRITICAL or HIGH vulnerabilities (amd64)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              env:
                  TRIVY_PLATFORM: linux/amd64
              with:
                  image-ref: ghcr.io/sjtrotter/dashbuddy-census-caddy@${{ steps.build.outputs.digest }}
                  severity: CRITICAL,HIGH
                  exit-code: '1'
                  format: table
            - name: Fail on CRITICAL or HIGH vulnerabilities (arm64)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              env:
                  TRIVY_PLATFORM: linux/arm64
              with:
                  image-ref: ghcr.io/sjtrotter/dashbuddy-census-caddy@${{ steps.build.outputs.digest }}
                  severity: CRITICAL,HIGH
                  exit-code: '1'
                  format: table
            - name: The committed Caddyfile must adapt with this binary and the plugin must be present
              env:
                  IMAGE: ghcr.io/sjtrotter/dashbuddy-census-caddy@${{ steps.build.outputs.digest }}
              run: |
                  docker run --rm "$IMAGE" caddy list-modules | grep -qx http.handlers.rate_limit
                  docker run --rm -v "$PWD/deploy/compose/Caddyfile:/etc/caddy/Caddyfile:ro" \
                      -e PUBLIC_HOST=census.example.test -e ACME_EMAIL=ops@example.test -e OPS_BIND_IP=127.0.0.1 \
                      "$IMAGE" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
              with:
                  image: ghcr.io/sjtrotter/dashbuddy-census-caddy@${{ steps.build.outputs.digest }}
                  format: spdx-json
                  output-file: sbom.spdx.json
                  upload-release-assets: false
            - name: Promote the scanned manifest with its provenance and SBOM
              env:
                  IMAGE: ghcr.io/sjtrotter/dashbuddy-census-caddy
                  DIGEST: ${{ steps.build.outputs.digest }}
                  VERSION: ${{ github.ref_name }}
              run: |
                  docker buildx imagetools create \
                      --tag "$IMAGE:$VERSION" \
                      --tag "$IMAGE:latest" \
                      "$IMAGE@$DIGEST"
                  published_digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
                  test "$published_digest" = "$DIGEST"
            - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
            - name: Sign the promoted immutable image digest (keyless)
              env:
                  IMAGE: ghcr.io/sjtrotter/dashbuddy-census-caddy@${{ steps.build.outputs.digest }}
              run: cosign sign --yes "$IMAGE"
