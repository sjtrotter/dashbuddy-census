version: 2
updates:
    - package-ecosystem: gradle
      directory: /
      schedule:
          interval: weekly
      ignore:
          # Kotlin follows the app repo (the census-contract included build compiles in the same invocation).
          - dependency-name: "org.jetbrains.kotlin*"
          - dependency-name: "kotlin"
    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
      ignore:
          # JDK major stays at 21 (toolchain + app parity); bump deliberately, not by bot.
          - dependency-name: "eclipse-temurin"
            update-types: ["version-update:semver-major"]
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
