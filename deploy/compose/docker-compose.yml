services:
    census:
        # production pins @sha256:<digest>; replace the tag expression when promoting.
        image: ghcr.io/sjtrotter/dashbuddy-census:${CENSUS_IMAGE_TAG:-latest}
        env_file: .env
        environment:
            ALARM_SPOOL_DIR: /var/spool/census-alarms
            # Bounded JVM on the 2 GiB host (#1179). Bounded: heap 320, metaspace 96, direct 32 (Netty is
            # told to count against the JDK limit), code cache 48, 512 KiB stacks (Dispatchers.IO can reach
            # 64 threads + Ktor's: ~35 MiB reserved, less resident), SerialGC pinned so a later limit change
            # cannot flip the collector unnoticed. Not bounded: GC/JVM text, malloc. The sized /tmp tmpfs
            # below is charged to this cgroup too. ESTIMATE ≈ 560 MiB under the 704 limit, not a proof.
            # A HotSpot-raised heap/metaspace OutOfMemoryError exits so Compose restarts a healthy process;
            # a direct-buffer exhaustion is a Java-thrown error and degrades to failed requests instead.
            # JAVA_TOOL_OPTIONS is additive to the image's JAVA_OPTS (disjoint keys).
            JAVA_TOOL_OPTIONS: -Xmx320m -XX:MaxMetaspaceSize=96m -XX:MaxDirectMemorySize=32m -XX:ReservedCodeCacheSize=48m -Xss512k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError -Dio.netty.maxDirectMemory=0
        volumes:
            - alarm-spool:/var/spool/census-alarms
        # Memory limits bound ONE runaway service to its cgroup (#1179). Budget on a t4g.small (1835 MiB,
        # no swap): limits sum to 1120 MiB (704 + 320 + 96), leaving 715 MiB for the host — ~540 at rest
        # plus the daily backup's aws-cli/gzip and a deploy's compose CLI. The residual host-OOM risk is
        # host/agent/transient use exceeding those 715 MiB; the memory alarm (90 %) is the backstop.
        deploy:
            resources:
                limits:
                    memory: 704M
        read_only: true
        tmpfs:
            - /tmp:size=32m
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        networks: [edge, db]
    postgres:
        image: postgres:16-alpine
        # Budget visible here (#1179), an ESTIMATE not a bound (work_mem is per plan node, and parallel
        # workers/hashes add to it): shared_buffers 128 (the default) + 3 autovacuum workers × 16 + one
        # manual maintenance op 32 + 20 connections (count cap: app pool 5 + Flyway + pg_dump/psql) × ~2
        # work_mem nodes × 2 MiB ≈ 288 MiB under the 320 limit, which is the real backstop. The queries
        # are small aggregates, so work_mem 2 MiB costs nothing. The official entrypoint still runs initdb
        # and su-execs uid 70.
        command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=20", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=32MB", "-c", "autovacuum_work_mem=16MB"]
        environment:
            POSTGRES_DB: census
            POSTGRES_USER: census
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
        volumes:
            - pgdata:/var/lib/postgresql/data
        deploy:
            resources:
                limits:
                    memory: 320M
        healthcheck:
            test: [CMD-SHELL, "pg_isready -U census -d census"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
        networks: [db]
    caddy:
        # #1178: upstream Caddy + caddy-ratelimit, built by .github/workflows/caddy-image.yml. Production pins the
        # whole reference BY DIGEST in this committed file (@sha256:…, like the census image) once a caddy-v* tag
        # has published; the image deploy workflow never touches this line (its sed is scoped to the census service).
        # caddy-v0.1.0 (Caddy 2.11.6 + caddy-ratelimit 5625512f), published 2026-10-03 and keyless-signed by caddy-image.yml.
        image: ${CADDY_IMAGE_REF:-ghcr.io/sjtrotter/dashbuddy-census-caddy@sha256:64eb40c86a415e790093e21e902b60a5b7a85fa77215bcff3c6d730c1f702637}
        environment:
            PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .env}
            ACME_EMAIL: ${ACME_EMAIL:-}
            # #1181: the operator listener's address. The public site answers 404 for /ops; the operator site is
            # published ONLY on this host address (the WireGuard address, or loopback when no VPN is configured).
            OPS_BIND_IP: ${OPS_BIND_IP:-127.0.0.1}
        deploy:
            resources:
                limits:
                    memory: 96M
        ports:
            - "80:80"
            - "443:443"
            - "${OPS_BIND_IP:-127.0.0.1}:8443:8443"
        volumes:
            - caddy_data:/data
            - caddy_config:/config
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
        restart: unless-stopped
        depends_on:
            - census
        networks: [edge]

networks:
    edge:
        # Caddy needs egress for ACME certificate issuance and renewal.
        driver: bridge
    db:
        driver: bridge
        internal: true

volumes:
    alarm-spool:
    pgdata:
    caddy_data:
    caddy_config:
