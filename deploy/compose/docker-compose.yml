services:
    census:
        # production pins @sha256:<digest>; replace the tag expression when promoting.
        image: ghcr.io/sjtrotter/dashbuddy-census:${CENSUS_IMAGE_TAG:-latest}
        env_file: .env
        environment:
            ALARM_SPOOL_DIR: /var/spool/census-alarms
            # Bounded JVM on the 2 GiB host (#1179): heap + metaspace + direct memory stay under the
            # container limit below, and an OutOfMemoryError exits so Compose restarts a healthy process
            # instead of a limping one. JAVA_TOOL_OPTIONS is additive to the image's JAVA_OPTS.
            JAVA_TOOL_OPTIONS: -Xmx384m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=64m -XX:+ExitOnOutOfMemoryError
        volumes:
            - alarm-spool:/var/spool/census-alarms
        # Memory limits make the cgroup, not the kernel's host-wide OOM killer, pick the victim (#1179).
        # Budget on a t4g.small (1.8 GiB usable, no swap): ~540 MiB host/agents + 768 + 384 + 128.
        deploy:
            resources:
                limits:
                    memory: 768M
        read_only: true
        tmpfs:
            - /tmp
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        networks: [edge, db]
    postgres:
        image: postgres:16-alpine
        # shared_buffers stays at the 128 MiB default; max_connections 20 caps per-connection memory
        # (the app pool is 5, plus pg_dump/psql). Both are explicit so the budget is visible here (#1179).
        command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=20"]
        environment:
            POSTGRES_DB: census
            POSTGRES_USER: census
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
        volumes:
            - pgdata:/var/lib/postgresql/data
        deploy:
            resources:
                limits:
                    memory: 384M
        healthcheck:
            test: [CMD-SHELL, "pg_isready -U census -d census"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
        networks: [db]
    caddy:
        image: caddy:2-alpine
        environment:
            PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .env}
            ACME_EMAIL: ${ACME_EMAIL:-}
        deploy:
            resources:
                limits:
                    memory: 128M
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - caddy_data:/data
            - caddy_config:/config
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
        restart: unless-stopped
        depends_on:
            - census
        networks: [edge]

networks:
    edge:
        # Caddy needs egress for ACME certificate issuance and renewal.
        driver: bridge
    db:
        driver: bridge
        internal: true

volumes:
    alarm-spool:
    pgdata:
    caddy_data:
    caddy_config:
